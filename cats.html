<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看板猫の写真集｜琉球ガラス工房 雫</title>
<meta name="description" content="琉球ガラス工房 雫の看板猫の写真集ページです。">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#333333;
    --ink-soft:#666666;
    --ink-faint:#999999;
    --paper:#ffffff;
    --paper-warm:#f7f7f7;
    --line:#e2e2e2;
    --stamp:#1c8081;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Noto Sans JP', sans-serif; font-weight:700; letter-spacing:.02em;}
  a{color:inherit; text-decoration:none;}
  img,svg{display:block; max-width:100%;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 28px;}

  header{
    padding:16px 0; border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.94); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:100;
  }
  header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .brand img{height:36px; width:auto;}
  .back-link{
    font-size:.88rem; color:var(--ink); border:1.5px solid var(--ink);
    border-radius:999px; padding:9px 20px; transition:background .3s ease, color .3s ease;
  }
  .back-link:hover{background:var(--ink); color:var(--paper);}

  .intro{padding:80px 0 40px; text-align:center;}
  .intro .section-eyebrow{
    font-size:.76rem; letter-spacing:.3em; text-transform:uppercase;
    color:var(--stamp); font-weight:700; margin-bottom:16px;
  }
  .intro h1{font-size:clamp(1.6rem,3.4vw,2.3rem); margin-bottom:18px;}
  .intro p{color:var(--ink-soft); max-width:560px; margin:0 auto; font-size:1rem;}

  .note{
    max-width:640px; margin:0 auto 50px; background:var(--paper-warm);
    border:1px solid var(--line); border-radius:6px; padding:18px 24px;
    font-size:.86rem; color:var(--ink-soft); text-align:center;
  }
  .note strong{color:var(--ink);}

  .gallery{padding:0 0 100px;}
  .gallery-grid{
    column-count:3; column-gap:22px;
  }
  .photo-card{
    break-inside:avoid; margin-bottom:22px;
    border-radius:8px; overflow:hidden; background:var(--paper-warm);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .photo-card img{
    width:100%; height:auto; border-radius:8px;
    transition:transform .5s ease;
  }
  .photo-card:hover img{transform:scale(1.03);}

  footer{
    background:var(--paper-warm); color:var(--ink); padding:48px 0 26px;
    border-top:1px solid var(--line); text-align:center;
  }
  footer .foot-links{
    display:flex; flex-wrap:wrap; gap:22px; justify-content:center; font-size:.88rem; margin-bottom:22px;
  }
  footer .foot-links a:hover{color:var(--stamp);}
  footer .foot-note{font-size:.8rem; color:var(--ink-faint);}

  @media (max-width:820px){
    .gallery-grid{column-count:2;}
  }
  @media (max-width:520px){
    .gallery-grid{column-count:1;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="logo-mark.png" alt="琉球ガラス工房 雫 sizuku glass ロゴ">
    </a>
    <a href="index.html" class="back-link">← トップページに戻る</a>
  </div>
</header>

<section class="intro">
  <div class="wrap">
    <div class="section-eyebrow">CATS</div>
    <h1>工房の看板猫の写真集</h1>
  </div>
</section>

<section class="gallery">
  <div class="wrap">
    <!-- 写真を追加する場合は cats フォルダに画像を入れて、同じ書き方で .photo-card を増やしてください。 -->
    <div class="gallery-grid">
      <div class="photo-card"><img src="cats/neko01.jpg" alt="工房の看板猫、テーブルの上でくつろぐ黒猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko02.jpg" alt="工房の看板猫、床でごろんと転がる黒猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko03.jpg" alt="工房のウッドデッキを歩く茶白猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko04.jpg" alt="工房の棚の上であくびをする黒猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko05.jpg" alt="椅子の上で気持ちよさそうに寝る茶白猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko06.jpg" alt="工房のランプの下にいる黒猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko07.jpg" alt="工房の外で並んでくつろぐ茶白猫2匹" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko08.jpg" alt="椅子の上で顔を隠して眠る茶白猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko09.jpg" alt="カラフルな糸のれんから顔を出す茶白猫" loading="lazy"></div>
      <div class="photo-card"><img src="cats/neko10.jpg" alt="日だまりでくつろぐ茶トラ猫" loading="lazy"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-links">
      <a href="index.html">トップページ</a>
      <a href="https://reserve.sizuku-taiken.com">ご予約</a>
      <a href="https://catalog.sizuku-taiken.com">カタログ</a>
    </div>
    <div class="foot-note">© 2026 琉球ガラス工房 雫</div>
  </div>
</footer>

</body>
</html>
